<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Dashboard v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen selection:bg-orange-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Icônes Vectorielles Normalisées ---
    const IconBtc = ({ className = "w-6 h-6" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M11.767 19.089c4.924.868 6.14-6.025 1.216-6.894m-1.216 6.894L5.86 18.047m5.908 1.042-.347 1.97m1.563-8.864c4.924.869 6.14-6.025 1.215-6.893m-1.215 6.893-3.94-.694m5.155-6.2L8.29 4.26m5.908 1.042.348-1.97M7.48 20.364l3.126-17.727"/>
      </svg>
    );
    const IconDashboard = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
      </svg>
    );
    const IconList = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/>
        <circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
      </svg>
    );
    const IconPlus = () => (
      <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14"/><path d="M12 5v14"/>
      </svg>
    );
    const IconLock = () => (
      <svg className="w-8 h-8 text-orange-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );
    const IconTrendingUp = () => (
      <svg className="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
      </svg>
    );
    const IconTrendingDown = () => (
      <svg className="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>
      </svg>
    );

    function App() {
      // Configuration Backend
      // ⚠️ METTRE ICI L'URL GÉNÉRÉE APRÈS LE DÉPLOIEMENT DU NOUVEAU SCRIPT APPS SCRIPT
      const GOOGLE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx5fAY6Pg6vCJX1wHmdZkCr1FzrAeR0iylOEM5UtYaKfuSLsT5C7mRGZB9WeOTu9Rpj1A/exec";

      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [password, setPassword] = useState(localStorage.getItem('btc_pwd_v3') || '');
      const [loginError, setLoginError] = useState('');
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedFilter, setSelectedFilter] = useState('Tous');
      const [data, setData] = useState({ indicators: {}, transactions: [] });
      const [isLoading, setIsLoading] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isSaving, setIsSaving] = useState(false);

      // Vérification session existante
      useEffect(() => {
        if (password && !isAuthenticated) {
          loadBackendData(password);
        }
      }, []);

      const loadBackendData = async (pwd) => {
        setIsAuthenticating(true);
        setIsLoading(true);
        setLoginError('');
        try {
          const res = await fetch(`${GOOGLE_WEBAPP_URL}?pwd=${encodeURIComponent(pwd)}`);
          const json = await res.json();
          if (json.error) {
            setLoginError(json.error);
            setIsAuthenticated(false);
            localStorage.removeItem('btc_pwd_v3');
          } else {
            setData(json);
            setIsAuthenticated(true);
            setPassword(pwd);
            localStorage.setItem('btc_pwd_v3', pwd);
          }
        } catch (err) {
          setLoginError("Erreur d'accès au Webhook Google Apps Script.");
        } finally {
          setIsAuthenticating(false);
          setIsLoading(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const pwdInput = e.target.pwd.value;
        loadBackendData(pwdInput);
      };

      const handleLogout = () => {
        localStorage.removeItem('btc_pwd_v3');
        setPassword('');
        setIsAuthenticated(false);
        setData({ indicators: {}, transactions: [] });
      };

      const handleAddTx = async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const payload = {
          date: form.get('date'),
          type: form.get('type'),
          investedCHF: form.get('investedCHF') || 0,
          amountBTC: form.get('amountBTC') || 0,
          platformFees: form.get('platformFees') || 0,
          networkFees: form.get('networkFees') || 0,
          notes: form.get('notes') || '',
          pwd: password
        };

        setIsSaving(true);
        try {
          await fetch(GOOGLE_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          // Délai de temporisation pour laisser Google Sheets recalculer ses formules
          await new Promise(r => setTimeout(r, 2000));
          await loadBackendData(password);
          setIsModalOpen(false);
        } catch (err) {
          alert("Erreur lors de l'enregistrement de l'opération.");
        } finally {
          setIsSaving(false);
        }
      };

      const filteredTransactions = useMemo(() => {
        if (selectedFilter === 'Tous') return data.transactions;
        return data.transactions.filter(t => t.type === selectedFilter);
      }, [data.transactions, selectedFilter]);

      // --- Écran de verrouillage ---
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <form onSubmit={handleLogin} className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 max-w-sm w-full">
              <div className="w-16 h-16 bg-orange-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <IconLock />
              </div>
              <h1 className="text-xl font-semibold text-center text-slate-900 mb-1">Portefeuille Bitcoin v3</h1>
              <p className="text-xs text-center text-slate-500 mb-6">Accès sécurisé réservé au propriétaire</p>

              <input
                type="password"
                name="pwd"
                required
                placeholder="Clé de sécurité..."
                className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl mb-4 text-center font-medium focus:bg-white focus:ring-2 focus:ring-orange-500 outline-none transition"
              />

              {loginError && <p className="text-xs text-rose-600 text-center mb-4">{loginError}</p>}

              <button
                type="submit"
                disabled={isAuthenticating}
                className="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 rounded-xl transition flex justify-center items-center shadow-sm"
              >
                {isAuthenticating ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"/> : "Déverrouiller"}
              </button>
            </form>
          </div>
        );
      }

      const ind = data.indicators || {};
      const isPnLPositive = !(ind.unrealized_pnl_gross_chf || '').includes('-');

      return (
        <div className="pb-24">
          {/* Header Responsive */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-orange-600 p-2 rounded-xl text-white">
                  <IconBtc className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-base font-semibold text-slate-900 leading-tight">Bitcoin v3</h1>
                  <span className="text-[10px] text-slate-400 font-mono">v3.0 • Normalisé</span>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <div className="bg-slate-100 px-3 py-1.5 rounded-full flex items-center space-x-1.5 border border-slate-200/60">
                  <span className="text-[11px] text-slate-500">Cours:</span>
                  <span className="text-xs font-semibold text-slate-800">{ind.btc_price_chf || '---'}</span>
                </div>
                <button
                  onClick={handleLogout}
                  className="text-xs text-slate-500 hover:text-rose-600 font-medium transition px-2 py-1"
                >
                  Fermer
                </button>
              </div>
            </div>
          </header>

          {/* Onglets */}
          <div className="bg-white border-b border-slate-200 mb-6">
            <div className="max-w-6xl mx-auto px-4 flex space-x-6">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`flex items-center space-x-2 py-3.5 border-b-2 text-sm font-medium transition ${
                  activeTab === 'dashboard' ? 'border-orange-600 text-orange-600' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <IconDashboard />
                <span>Synthèse</span>
              </button>
              <button
                onClick={() => setActiveTab('transactions')}
                className={`flex items-center space-x-2 py-3.5 border-b-2 text-sm font-medium transition ${
                  activeTab === 'transactions' ? 'border-orange-600 text-orange-600' : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <IconList />
                <span>Journal ({data.transactions.length})</span>
              </button>
            </div>
          </div>

          <main className="max-w-6xl mx-auto px-4">
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                {/* Solde & Évaluation Principale */}
                <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-xs relative overflow-hidden">
                  <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                      <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Avoir Total Portefeuille</span>
                      <div className="text-3xl sm:text-5xl font-light text-slate-900 mt-1 tracking-tight">
                        {ind.btc_total_balance || '2.01862750 BTC'}
                      </div>
                      <div className="text-lg sm:text-xl font-medium text-slate-500 mt-1">
                        ≈ {ind.portfolio_current_value_chf || '---'}
                      </div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-start md:items-end">
                      <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Plus-Value Latente</span>
                      <div className={`text-2xl font-semibold flex items-center mt-0.5 ${isPnLPositive ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {isPnLPositive ? <IconTrendingUp /> : <IconTrendingDown />}
                        <span>{ind.unrealized_pnl_gross_chf || '---'}</span>
                      </div>
                      <span className={`text-xs font-semibold mt-0.5 ${isPnLPositive ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {ind.unrealized_return_pct || '---'}
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-8 pt-6 border-t border-slate-100">
                    <div>
                      <span className="text-[11px] text-slate-400 block uppercase font-medium">Total Investi Flux</span>
                      <span className="text-base font-semibold text-slate-800">{ind.total_invested_purchases_chf || '---'}</span>
                    </div>
                    <div>
                      <span className="text-[11px] text-slate-400 block uppercase font-medium">PRU Moyen Achats</span>
                      <span className="text-base font-semibold text-slate-800">{ind.pru_purchases_chf_per_btc || '---'}</span>
                    </div>
                    <div>
                      <span className="text-[11px] text-slate-400 block uppercase font-medium">PRU Effectif (Net)</span>
                      <span className="text-base font-semibold text-slate-800">{ind.pru_effective_chf_per_btc || '---'}</span>
                    </div>
                    <div>
                      <span className="text-[11px] text-slate-400 block uppercase font-medium">Bonus / Parrainage</span>
                      <span className="text-base font-semibold text-orange-600">{ind.bonus_btc_total || '---'}</span>
                    </div>
                  </div>
                </div>

                {/* Synthèse des Frais (Purement Indicatifs) */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Structure des Frais (Inclus / Non déduits à double)</span>
                    <span className="text-xs font-semibold text-slate-700 bg-slate-100 px-2.5 py-0.5 rounded-full">
                      Total: {ind.total_all_fees_chf || '---'}
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                      <span className="text-[11px] text-slate-400 block">Frais Plateformes (inclus dans C)</span>
                      <span className="text-sm font-semibold text-slate-800">{ind.total_platform_fees_chf || '---'}</span>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                      <span className="text-[11px] text-slate-400 block">Frais Réseau (on-chain)</span>
                      <span className="text-sm font-semibold text-slate-800">{ind.total_network_fees_chf || '---'}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'transactions' && (
              <div className="space-y-4">
                {/* Sélecteur de filtre */}
                <div className="flex flex-wrap gap-2">
                  {['Tous', 'Achat', 'Vente', 'Envoi', 'Réception'].map((f) => (
                    <button
                      key={f}
                      onClick={() => setSelectedFilter(f)}
                      className={`text-xs px-3.5 py-1.5 rounded-full font-medium transition ${
                        selectedFilter === f
                          ? 'bg-slate-900 text-white'
                          : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                      }`}
                    >
                      {f}
                    </button>
                  ))}
                </div>

                {/* Tableau Journal des Transactions */}
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-50/75 border-b border-slate-200 text-slate-400 uppercase font-semibold">
                          <th className="py-3 px-4">Date</th>
                          <th className="py-3 px-3">Type</th>
                          <th className="py-3 px-3 text-right">Montant CHF</th>
                          <th className="py-3 px-3 text-right">Montant BTC</th>
                          <th className="py-3 px-3 text-right hidden sm:table-cell">Prix Exéc.</th>
                          <th className="py-3 px-3 text-right hidden md:table-cell">Solde Cumulé</th>
                          <th className="py-3 px-4 hidden lg:table-cell">Notes</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredTransactions.map((t) => {
                          const isPositiveBtc = !t.amountBTC.includes('-');
                          let badgeBg = "bg-slate-100 text-slate-700";
                          if (t.type === "Achat") badgeBg = "bg-emerald-50 text-emerald-700 border border-emerald-200/50";
                          if (t.type === "Vente") badgeBg = "bg-rose-50 text-rose-700 border border-rose-200/50";
                          if (t.type === "Envoi") badgeBg = "bg-amber-50 text-amber-700 border border-amber-200/50";
                          if (t.type === "Réception") badgeBg = "bg-blue-50 text-blue-700 border border-blue-200/50";

                          return (
                            <tr key={t.id} className="hover:bg-slate-50/60 transition">
                              <td className="py-3 px-4 text-slate-600 whitespace-nowrap">{t.date}</td>
                              <td className="py-3 px-3">
                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${badgeBg}`}>
                                  {t.type}
                                </span>
                              </td>
                              <td className="py-3 px-3 text-right font-medium text-slate-800">{t.investedCHF || '—'}</td>
                              <td className={`py-3 px-3 text-right font-mono font-medium ${isPositiveBtc ? 'text-emerald-600' : 'text-rose-600'}`}>
                                {t.amountBTC}
                              </td>
                              <td className="py-3 px-3 text-right text-slate-500 hidden sm:table-cell">{t.execPrice || '—'}</td>
                              <td className="py-3 px-3 text-right font-mono text-slate-700 hidden md:table-cell">{t.cumulBTC}</td>
                              <td className="py-3 px-4 text-slate-400 truncate max-w-xs hidden lg:table-cell">{t.notes || '—'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Bouton Flottant Ajout */}
          <button
            onClick={() => setIsModalOpen(true)}
            className="fixed bottom-6 right-6 bg-orange-600 text-white p-4 rounded-2xl shadow-lg hover:bg-orange-700 transition flex items-center space-x-2 z-40 active:scale-95"
          >
            <IconPlus />
            <span className="font-medium text-sm hidden sm:inline pr-1">Opération</span>
          </button>

          {/* Modale d'enregistrement */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-base font-semibold text-slate-900">Nouvelle opération</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                </div>

                <form onSubmit={handleAddTx} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Date</label>
                      <input
                        type="date"
                        name="date"
                        required
                        defaultValue={new Date().toISOString().split('T')[0]}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Type d'opération</label>
                      <select
                        name="type"
                        required
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                      >
                        <option value="Achat">Achat</option>
                        <option value="Vente">Vente</option>
                        <option value="Envoi">Envoi</option>
                        <option value="Réception">Réception</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Montant CHF</label>
                      <input
                        type="number"
                        name="investedCHF"
                        step="0.01"
                        min="0"
                        placeholder="0.00"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Montant BTC</label>
                      <input
                        type="number"
                        name="amountBTC"
                        step="0.00000001"
                        required
                        placeholder="0.00000000"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Frais Plat. (CHF)</label>
                      <input
                        type="number"
                        name="platformFees"
                        step="0.01"
                        defaultValue="0"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Frais Réseau (CHF)</label>
                      <input
                        type="number"
                        name="networkFees"
                        step="0.01"
                        defaultValue="0"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                      />
                    </div>
                  </div>

                  {/* Mention réglementaire et méthodologique */}
                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200/60 text-[11px] text-amber-800 leading-relaxed">
                    <strong>Note méthodologique :</strong> Les frais de plateforme sont inclus dans le montant CHF. Pour un envoi, indiquez dans le montant BTC le total débité (montant envoyé + frais réseau en sats).
                  </div>

                  <div>
                    <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1">Notes / Contexte</label>
                    <input
                      type="text"
                      name="notes"
                      placeholder="Commentaire facultatif..."
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white outline-none"
                    />
                  </div>

                  <div className="pt-2 flex space-x-3">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="flex-1 py-2.5 bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-200 transition"
                    >
                      Annuler
                    </button>
                    <button
                      type="submit"
                      disabled={isSaving}
                      className="flex-1 py-2.5 bg-orange-600 text-white text-xs font-semibold rounded-xl hover:bg-orange-700 transition flex items-center justify-center shadow-xs"
                    >
                      {isSaving ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/> : "Valider l'opération"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
